<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Hallium — Korean learning that feels personal, calm and structured." />
  <title>Hallium</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#home" aria-label="Hallium home">
        <span class="brand-mark">ㅎ</span>
        <span>
          <strong>Hallium</strong>
          <small>한국어, your way</small>
        </span>
      </a>

      <span class="nav-section-label">LEARN</span>
      <nav class="nav-list">
        <button class="nav-item is-active" data-route="home"><span class="nav-kicker">01</span><span>Today</span></button>
        <button class="nav-item" data-route="foundation"><span class="nav-kicker">02</span><span>Foundation</span></button>
        <button class="nav-item" data-route="vocabulary"><span class="nav-kicker">03</span><span>Vocabulary</span></button>
        <button class="nav-item" data-route="grammar"><span class="nav-kicker">04</span><span>Grammar</span></button>
        <button class="nav-item" data-route="test"><span class="nav-kicker">05</span><span>TOPIK & Test</span></button>
        <button class="nav-item" data-route="practice"><span class="nav-kicker">06</span><span>Practice</span></button>
        <button class="nav-item" data-route="partner"><span class="nav-kicker">07</span><span>Partner Korean</span></button>
      </nav>

      <span class="nav-section-label secondary-label">HALLIUM</span>
      <nav class="nav-list secondary-nav">
        <button class="nav-item" data-route="landing"><span class="nav-kicker">↗</span><span>Public site</span></button>
        <button class="nav-item" data-route="creator"><span class="nav-kicker">↗</span><span>Creator program</span></button>
      </nav>

      <div class="sidebar-foot">
        <div class="streak-card">
          <span class="eyebrow">This week</span>
          <strong>4-day rhythm</strong>
          <p>Consistency over pressure.</p>
        </div>
        <button class="profile-chip" type="button">
          <span class="avatar">S</span>
          <span><strong>Susan</strong><small>TOPIK I · Beginner</small></span>
        </button>
      </div>
    </aside>

    <header class="mobile-bar">
      <a class="brand compact" href="#home"><span class="brand-mark">ㅎ</span><strong>Hallium</strong></a>
      <button class="menu-button" id="menuButton" aria-label="Open navigation">Menu</button>
    </header>

    <main id="view" class="main-view" tabindex="-1"></main>
  </div>

  <div class="mobile-nav" id="mobileNav" aria-hidden="true">
    <div class="mobile-nav-panel">
      <div class="mobile-nav-head"><strong>Navigate Hallium</strong><button id="closeMenu">Close</button></div>
      <nav>
        <button data-route="home">Today</button>
        <button data-route="foundation">Foundation</button>
        <button data-route="vocabulary">Vocabulary</button>
        <button data-route="grammar">Grammar</button>
        <button data-route="test">TOPIK & Test</button>
        <button data-route="practice">Practice</button>
        <button data-route="partner">Partner Korean</button>
        <button data-route="landing">Public site</button>
        <button data-route="creator">Creator program</button>
      </nav>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
